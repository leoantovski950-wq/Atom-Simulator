[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atom-sim"
version = "0.1.0"
description = "Modular atomic physics simulation core (hydrogenic quantum + classical EM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
